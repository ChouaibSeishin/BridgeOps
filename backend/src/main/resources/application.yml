spring:
  application:
    name: bridgeops
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bridgeops}
    username: ${DATABASE_USER:bridgeops}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring.lifecycle.timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
bridgeops:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${bridgeops.api-docs.enabled}
  swagger-ui:
    enabled: ${bridgeops.api-docs.enabled}
