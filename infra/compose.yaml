name: bridgeops
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: bridgeops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/setup-local.ps1}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Required app database password}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Required migration password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init-database.sh:/docker-entrypoint-initdb.d/10-bridgeops.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bridgeops"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bridgeops
      DATABASE_USER: bridgeops_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Required app database password}
      SPRING_FLYWAY_USER: bridgeops_migrator
      SPRING_FLYWAY_PASSWORD: ${MIGRATION_PASSWORD:?Required migration password}
      API_DOCS_ENABLED: "false"
      BRIDGEOPS_AUTH_ENABLED: "true"
      BRIDGEOPS_AUTH_ORIGIN: ${AUTH_ORIGIN:-http://localhost:${BRIDGEOPS_PORT:-8088}}
      BRIDGEOPS_AUTH_LOCAL_HTTP: "true"
      BRIDGEOPS_AUTH_ISSUER: bridgeops-local
      BRIDGEOPS_AUTH_KEY_ID: local-v1
      BRIDGEOPS_AUTH_PRIVATE_KEY: /run/bridgeops-auth/access-private.pem
      BRIDGEOPS_AUTH_PUBLIC_KEY: /run/bridgeops-auth/access-public.pem
      BRIDGEOPS_AUTH_CSRF_KEY: /run/bridgeops-auth/csrf.key
    volumes:
      - ../secrets/auth:/run/bridgeops-auth:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    stop_grace_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${BRIDGEOPS_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  postgres_data:
