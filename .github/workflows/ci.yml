name: Verify BridgeOps
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Scan repository history for secrets
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/bridgeops-gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/bridgeops-gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bridgeops-gitleaks"
          tar -xzf "$RUNNER_TEMP/bridgeops-gitleaks.tar.gz" -C "$RUNNER_TEMP/bridgeops-gitleaks" gitleaks
          "$RUNNER_TEMP/bridgeops-gitleaks/gitleaks" git --redact --no-banner
      - name: Documentation structure
        run: node scripts/verify-docs.mjs
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install Chromium for required browser journey
        working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - name: Backend unit and required PostgreSQL integration tests
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B -ntp verify
      - name: Required test report gate
        run: node scripts/verify-test-reports.mjs
      - name: Generate ephemeral local environment
        shell: pwsh
        run: |
          ./scripts/setup-local.ps1
          ./scripts/setup-auth.ps1
          ./scripts/setup-integration-secrets.ps1
      - name: Build and start containers
        run: |
          test "$(id -u)" -ne 0
          printf 'BRIDGEOPS_RUNTIME_USER=%s:%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_ENV"
          BRIDGEOPS_RUNTIME_USER="$(id -u):$(id -g)" docker compose --env-file .env -f infra/compose.yaml up --build -d --wait --wait-timeout 180
      - name: Non-root private key mount and root refusal
        shell: bash
        run: |
          docker compose --env-file .env -f infra/compose.yaml exec -T backend sh -c 'test "$(id -u)" -ne 0 && test -r /run/bridgeops-integrations/local-v1.key && test ! -w /run/bridgeops-integrations/local-v1.key && test "$(wc -c < /run/bridgeops-integrations/local-v1.key)" -eq 32'
          backend="$(docker compose --env-file .env -f infra/compose.yaml ps -q backend)"
          image="$(docker inspect --format '{{.Image}}' "$backend")"
          set +e
          docker run --rm --network none --user 0 "$image" > "$RUNNER_TEMP/bridgeops-root-refusal.log" 2>&1
          root_status=$?
          set -e
          test "$root_status" -eq 78
      - name: Same-origin API smoke
        run: |
          curl --fail http://localhost:8088/api/v1/system/info
          curl --fail http://localhost:8088/health/readiness
          curl --fail --silent http://localhost:8088/api/v1/auth/csrf > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: http://localhost:8088' -H 'Content-Type: application/json' --data '{}' http://localhost:8088/api/v1/auth/login)" = 403
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Stop test services
        if: always()
        run: if test -f .env; then docker compose --env-file .env -f infra/compose.yaml down; fi
